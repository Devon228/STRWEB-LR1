[pytest]
DJANGO_SETTINGS_MODULE = PharmacyProject.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = pharmacy
addopts =
    --strict-markers
    --cov=pharmacy
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = pharmacy
omit =
    */migrations/*
    */tests/*
    pharmacy/tests.py
    */management/commands/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
