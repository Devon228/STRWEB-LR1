services:
  db:
    image: postgres:16-alpine
    container_name: pharmacy_db
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: dimasgitdocker/pharmacy-lr5:latest
    container_name: pharmacy_web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://pharmacy:pharmacy@db:5432/pharmacy
      SECRET_KEY: local-docker-secret-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      LOG_LEVEL: INFO
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      PHARMACY_CITY: Minsk
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
