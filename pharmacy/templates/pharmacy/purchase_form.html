{% extends 'pharmacy/base.html' %}
{% block title %}Покупка — {{ medication.name }}{% endblock %}
{% block content %}
<h2>Оформление покупки: {{ medication.name }}</h2>
<p>Цена: {{ medication.price }} BYN за единицу</p>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Купить</button>
</form>
{% endblock %}
