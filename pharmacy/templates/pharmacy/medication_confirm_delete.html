{% extends 'pharmacy/base.html' %}
{% block title %}Удаление — {{ object.name }}{% endblock %}
{% block content %}
<h2>Удалить медикамент?</h2>
<p><strong>{{ object.code }}</strong> — {{ object.name }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'pharmacy:medication_detail' object.code %}">Отмена</a>
</form>
{% endblock %}
